<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cube world - Level 2</title>
  <style>
    html, body { margin: 0; height: 100%; background: black; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(248, 247, 247, 0.6);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header id="info">
    <h2>Cube world - Level 2</h2>
    <p>by Kyle Young</p>
    <p>Left & Right arrows to rotate camera</p>
    <p id="cube_resolution_text">
    <p id="image_resolution_text">
    <p>If screen is blank, press r</p>
      
  </header>
  <canvas id="c"></canvas>
  <canvas id="height_canvas"></canvas>
  <canvas id="color_canvas"></canvas>

  <img src="height_map_0.png" id="height_map_0_img">
  <img src="height_map_1.png" id="height_map_1_img">
  <img src="height_map_2.png" id="height_map_2_img">
  <img src="height_map_3.png" id="height_map_3_img">
  <img src="height_map_4.png" id="height_map_4_img">
  <img src="height_map_5.png" id="height_map_5_img">
  
  <img src="color_map_0.png" id="color_map_0_img">
  <img src="color_map_1.png" id="color_map_1_img">
  <img src="color_map_2.png" id="color_map_2_img">
  <img src="color_map_3.png" id="color_map_3_img">
  <img src="color_map_4.png" id="color_map_4_img">
  <img src="color_map_5.png" id="color_map_5_img">
  
  <script src="index.js"></script>
</body>
</html>
